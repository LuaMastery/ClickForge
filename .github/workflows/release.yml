name: Build and release

# Roda quando uma tag "vX.Y.Z" é enviada ao repositório — ou seja, só depois
# que a versão nova já foi testada e aprovada. Compila o .exe no Windows e
# publica automaticamente como uma GitHub Release, com o arquivo anexado.
# É esse anexo que o verificador de atualização do próprio app usa.
#
# O .exe é compilado aqui, dentro do GitHub, a partir do código público da tag
# — não é enviado do computador de ninguém. Junto dele sai o hash SHA-256
# (conferido pelo próprio app antes de atualizar) e uma atestação de
# procedência assinada pelo GitHub, que prova qual commit gerou o arquivo.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar metadados do executável
        run: python make_version_info.py

      - name: Compilar ClickForge.exe
        run: python -m PyInstaller --onefile --windowed --noupx --name ClickForge --icon icon.ico --version-file version_info.txt clickforge.py

      - name: Gerar SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ClickForge.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ClickForge.exe" | Out-File -Encoding ascii dist/ClickForge.exe.sha256

      - name: Atestar procedência do build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ClickForge.exe

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/ClickForge.exe dist/ClickForge.exe.sha256 --title "ClickForge ${{ github.ref_name }}" --generate-notes
